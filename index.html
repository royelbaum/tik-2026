<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>הנהלת הנישואין</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=David+Libre:wght@400;500;700&family=Suez+One&family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   עיצוב: טופס ממשלתי, דיו סגול של חותמת, תיק מנילה
   ========================================================= */
:root{
  --desk:#2f3a35;          /* שולחן המשרד */
  --paper:#eef0e8;         /* נייר טופס */
  --paper-line:#c9cfc2;
  --ink:#1f2a44;           /* דיו כחול כהה */
  --ink-soft:#4b5670;
  --stamp:#5b3fa0;         /* חותמת סגולה */
  --classified:#b8262e;    /* סודי */
  --manila:#d6b36a;        /* תיק */
  --manila-dark:#b8944c;
  --slip:#fbf6d8;          /* פתק פיצוי */
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, #3b4943 0%, transparent 70%),
    var(--desk);
  color:var(--ink);
  font-family:"David Libre", "David", serif;
  font-size:19px;
  line-height:1.7;
  min-height:100vh;
  padding:28px 16px 64px;
}
.wrap{max-width:640px;margin:0 auto}

/* ---------- לשוניות התיק ---------- */
.tabs{
  display:flex; gap:4px; padding:0 10px;
  position:relative; z-index:1;
}
.tab{
  flex:1 1 0;
  appearance:none; border:0; cursor:pointer;
  font:inherit; font-family:"Suez One", serif; font-size:15px;
  color:#3a2e14;
  background:var(--manila);
  border-radius:10px 10px 0 0;
  padding:8px 4px 10px;
  text-align:center;
  box-shadow: inset 0 -6px 8px -6px rgba(0,0,0,.25);
  transform:translateY(6px);
  transition:transform .2s ease;
  line-height:1.2;
}
.tab small{display:block;font-family:"David Libre",serif;font-size:12px;opacity:.75;margin-top:2px}
.tab[aria-current="true"]{background:#e5c47c;transform:translateY(0)}
.tab:disabled{cursor:default;background:var(--manila-dark);color:#5d4a22;opacity:.85}
.tab:not(:disabled):hover{transform:translateY(2px)}
.tab[aria-current="true"]:hover{transform:translateY(0)}
.tab:focus-visible{outline:3px solid #fff;outline-offset:2px}
.lock{display:inline-block;width:10px;height:12px;vertical-align:-1px;margin-inline-start:3px}

/* ---------- התיק והדף ---------- */
.folder{
  background:#e5c47c;
  border-radius:4px 4px 10px 10px;
  padding:14px 12px 18px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
}
.sheet{
  position:relative;
  background:
    repeating-linear-gradient(to bottom, transparent 0 33px, rgba(31,42,68,.06) 33px 34px),
    var(--paper);
  padding:28px 26px 34px;
  box-shadow:0 2px 0 #d7dbcf, 0 4px 0 #cdd2c4, 0 10px 18px -8px rgba(0,0,0,.35);
  overflow:hidden;
}
.sheet::before{ /* קו שוליים */
  content:""; position:absolute; top:0; bottom:0; right:44px;
  width:1px; background:rgba(184,38,46,.25);
}

/* כותרת הטופס */
.form-head{
  display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center;
  border-bottom:2px solid var(--ink); padding-bottom:12px; margin-bottom:18px;
}
.seal{
  width:62px;height:62px;border-radius:50%;
  border:2px solid var(--ink);
  display:grid;place-items:center;
  position:relative;
}
.seal::after{content:"";position:absolute;inset:5px;border:1px solid var(--ink);border-radius:50%}
.seal svg{width:28px;height:28px}
.org{line-height:1.25}
.org b{display:block;font-family:"Suez One",serif;font-weight:400;font-size:22px}
.org span{font-size:15px;color:var(--ink-soft)}
.meta{font-size:14px;color:var(--ink-soft);text-align:left;line-height:1.5;white-space:nowrap}
.meta b{color:var(--ink);font-weight:700}

.doc-title{
  font-family:"Suez One",serif; font-weight:400;
  font-size:clamp(24px, 6vw, 32px); line-height:1.25;
  margin:4px 0 14px;
}
.subject{font-weight:700;margin:0 0 14px}
.subject u{text-decoration-thickness:1px;text-underline-offset:4px}
.body p{margin:0 0 14px}
.body ol{margin:6px 0 16px;padding-inline-start:22px}
.body li{margin-bottom:6px}
.body .reveal{
  border:1.5px dashed var(--classified);
  padding:12px 14px; margin:18px 0;
  background:rgba(184,38,46,.05);
}
.body .reveal b{color:var(--classified)}
.sign{
  margin-top:26px; display:flex; justify-content:space-between; align-items:flex-end; gap:10px;
}
.sign .sig{font-family:"Amatic SC",cursive;font-size:38px;line-height:1;color:var(--ink);transform:rotate(-3deg)}
.sign .role{font-size:15px;color:var(--ink-soft);line-height:1.4}

/* ---------- החותמת: הרגע היחיד שזז ---------- */
.stamp{
  position:absolute; top:84px; left:18px;
  font-family:"Suez One",serif; font-size:22px; line-height:1.15;
  color:var(--stamp);
  border:3px solid var(--stamp); border-radius:8px;
  padding:8px 14px; text-align:center;
  transform:rotate(-14deg);
  opacity:.82; mix-blend-mode:multiply;
  pointer-events:none;
  -webkit-mask-image: radial-gradient(circle at 30% 40%, #000 60%, rgba(0,0,0,.65) 61%, #000 75%);
          mask-image: radial-gradient(circle at 30% 40%, #000 60%, rgba(0,0,0,.65) 61%, #000 75%);
}
.stamp small{display:block;font-family:"David Libre",serif;font-size:13px;font-weight:700}
.stamp.red{color:var(--classified);border-color:var(--classified)}
.stamp.slam{animation:slam .55s cubic-bezier(.2,1.6,.4,1) .35s both}
@keyframes slam{
  0%{transform:rotate(-14deg) scale(2.4);opacity:0}
  60%{opacity:.9}
  100%{transform:rotate(-14deg) scale(1);opacity:.82}
}

/* ---------- פתק הפיצוי ---------- */
.slip{
  position:relative;
  background:var(--slip);
  margin:22px 8px 0;
  padding:18px 20px 16px;
  transform:rotate(.6deg);
  box-shadow:0 8px 14px -8px rgba(0,0,0,.45);
}
.slip::before{ /* מהדק */
  content:""; position:absolute; top:-14px; right:28px;
  width:16px; height:40px;
  border:3px solid #8d949c; border-radius:9px; border-bottom-color:transparent;
}
.slip h2{font-family:"Suez One",serif;font-weight:400;font-size:20px;margin:0 0 6px}
.slip p{margin:0}
.slip .where{margin-top:8px;font-size:16px;color:var(--ink-soft)}

/* ---------- תמונות: נספחים מהודקים לתיק ---------- */
.exhibit{
  position:relative;
  width:min(82%, 400px);
  margin:26px auto 4px;
  background:#fff;
  padding:12px 12px 14px;
  box-shadow:0 12px 20px -10px rgba(0,0,0,.55);
  transform:rotate(-2deg);
}
.exhibit.tilt-r{transform:rotate(1.8deg)}
.exhibit::before{ /* סלוטייפ */
  content:""; position:absolute; top:-12px; left:50%;
  width:96px; height:26px; margin-left:-48px;
  background:rgba(245,240,215,.75);
  box-shadow:0 1px 2px rgba(0,0,0,.15);
  transform:rotate(-3deg);
}
.exhibit img{display:block;width:100%;height:auto;aspect-ratio:var(--ar, 3/4);object-fit:cover}
.exhibit figcaption{
  font-family:"Amatic SC",cursive; font-size:28px; line-height:1.15;
  text-align:center; margin-top:10px; color:var(--ink);
}
.exhibit .tag{
  position:absolute; top:22px; right:-10px;
  background:var(--classified); color:#fff;
  font-family:"Suez One",serif; font-size:14px; line-height:1;
  padding:6px 10px; transform:rotate(4deg);
  box-shadow:0 2px 4px rgba(0,0,0,.3);
}
.gallery{margin:26px 4px 0}
.gallery h2{font-family:"Suez One",serif;font-weight:400;font-size:20px;text-align:center;margin:0 0 6px}
.gallery .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;align-items:start}
.gallery .exhibit{width:100%;margin:14px 0 0;padding:8px 8px 10px}
.gallery .exhibit::before{width:60px;margin-left:-30px;height:20px;top:-9px}
.gallery .exhibit figcaption{font-size:21px}
.gallery .exhibit .tag{font-size:12px;padding:4px 7px;top:14px}

/* ---------- שעון הפירעון ---------- */
.clock{
  margin:22px 8px 0; color:var(--ink);
  display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap;
  border-top:1px dashed rgba(31,42,68,.35); padding-top:14px;
}
.clock .label{font-size:16px;opacity:.8}
.clock .digits{font-family:"Suez One",serif;font-size:26px;letter-spacing:.5px;direction:rtl}
.clock .digits span{font-family:"David Libre",serif;font-size:15px;opacity:.75;margin:0 2px 0 8px}

/* ---------- מכתב אישי ---------- */
.note{
  margin:22px 8px 0; background:#fff; padding:20px 22px;
  font-family:"Amatic SC",cursive; font-size:30px; line-height:1.3;
  transform:rotate(-.8deg);
  box-shadow:0 8px 14px -8px rgba(0,0,0,.45);
  white-space:pre-line;
}

/* ---------- נעול ---------- */
.locked{text-align:center;padding:40px 10px}
.locked .doc-title{margin-bottom:8px}

footer{margin-top:26px;text-align:center;color:rgba(242,238,223,.55);font-size:14px}

/* ---------- קונפטי (קנבס) ---------- */
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:30}

/* ---------- המעטפה: פותחים בהקשה על החותם ---------- */
.envelope-screen{
  position:fixed; inset:0; z-index:20;
  display:grid; place-items:center; padding:24px 16px;
  background:
    radial-gradient(900px 500px at 50% 30%, #3b4943 0%, transparent 70%),
    var(--desk);
  transition:opacity .6s ease .9s, visibility 0s linear 1.5s;
}
.envelope-screen.open{opacity:0;visibility:hidden}
.env-wrap{width:min(92vw, 420px); text-align:center; color:#f2eedf}
.env-wrap .hint{margin-top:22px;font-size:17px;opacity:.75}
.envelope{
  position:relative; width:100%; aspect-ratio:1.45;
  perspective:900px;
  filter:drop-shadow(0 26px 30px rgba(0,0,0,.5));
}
.env-back{position:absolute;inset:0;background:var(--manila-dark);border-radius:6px}
.env-letter{
  position:absolute; left:7%; right:7%; top:8%; bottom:8%;
  background:var(--paper); border-radius:3px;
  transition:transform .8s cubic-bezier(.3,1.3,.5,1) .55s;
}
.env-letter::after{ /* שורות טקסט מרומזות על המכתב */
  content:""; position:absolute; inset:18% 12% auto 12%; height:44%;
  background:repeating-linear-gradient(to bottom, rgba(31,42,68,.25) 0 2px, transparent 2px 14px);
}
.env-front{
  position:absolute; inset:0; border-radius:6px; overflow:hidden;
  background:
    linear-gradient(to top right, transparent 49.6%, rgba(0,0,0,.08) 50%, transparent 50.4%),
    linear-gradient(to top left,  transparent 49.6%, rgba(0,0,0,.08) 50%, transparent 50.4%),
    var(--manila);
  clip-path:polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%);
}
.env-front .to{
  position:absolute; bottom:12%; right:9%; text-align:right;
  font-family:"Amatic SC",cursive; font-size:clamp(26px,7vw,34px); line-height:1.05; color:var(--ink);
}
.env-front .to small{display:block;font-family:"David Libre",serif;font-size:13px;color:#5d4a22}
.env-front .secret{
  position:absolute; bottom:14%; left:8%;
  font-family:"Suez One",serif; font-size:15px; color:var(--classified);
  border:2px solid var(--classified); border-radius:5px; padding:3px 8px;
  transform:rotate(-10deg); opacity:.8;
}
.env-flap{
  position:absolute; inset:0 0 auto 0; height:56%;
  background:#dcbb72;
  clip-path:polygon(0 0, 100% 0, 50% 100%);
  transform-origin:top center;
  transition:transform .6s ease .25s;
  z-index:2;
}
.wax{
  position:absolute; left:50%; top:56%; z-index:3;
  width:76px; height:76px; margin:-38px 0 0 -38px;
  border:0; border-radius:50%; cursor:pointer;
  background:radial-gradient(circle at 35% 30%, #d9444c, var(--classified) 55%, #7d1219);
  box-shadow:0 3px 0 #6a0f15, 0 8px 14px rgba(0,0,0,.4), inset 0 0 0 6px rgba(0,0,0,.12);
  display:grid; place-items:center;
  animation:pulse 2.2s ease-in-out infinite;
}
.wax svg{width:38px;height:38px;opacity:.85}
.wax:focus-visible{outline:3px solid #fff;outline-offset:4px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.envelope.opened .wax{animation:crack .45s ease forwards}
@keyframes crack{
  30%{transform:scale(1.15) rotate(-6deg)}
  100%{transform:scale(.2) rotate(25deg);opacity:0}
}
.envelope.opened .env-flap{transform:rotateX(180deg)}
.envelope.opened .env-letter{transform:translateY(-62%)}

/* ---------- תצוגה מקדימה (רק לך) ---------- */
.preview{
  margin:0 auto 18px; max-width:640px; display:flex; gap:6px; flex-wrap:wrap;
  justify-content:center; font-size:14px; color:#f2eedf;
}
.preview a{color:#f2eedf;border:1px solid rgba(242,238,223,.4);padding:2px 10px;border-radius:20px;text-decoration:none}
.preview a[aria-current="true"]{background:#f2eedf;color:var(--desk)}

@media (max-width:480px){
  body{font-size:18px;padding-top:18px}
  .sheet{padding:22px 18px 28px}
  .sheet::before{right:30px}
  .form-head{grid-template-columns:auto 1fr}
  .meta{grid-column:1 / -1;text-align:right;white-space:normal}
  .stamp{top:auto;bottom:70px;left:10px;font-size:19px}
  .tab{font-size:13px;padding:7px 2px 9px}
  .tab small{font-size:11px}
}
@media (prefers-reduced-motion:reduce){
  .stamp.slam{animation:none}
  .confetti{display:none}
  .tab{transition:none}
  .wax{animation:none}
  .envelope-screen{transition:none}
}
</style>
</head>

<div id="previewBar" class="preview" hidden></div>

<main class="wrap">
  <nav class="tabs" id="tabs" aria-label="מסמכים בתיק"></nav>
  <div class="folder">
    <article class="sheet" id="sheet" aria-live="polite"></article>
    <div id="extras"></div>
  </div>
  <footer>הנהלת הנישואין. כל הזכויות שמורות לשניכם.</footer>
</main>

<script>
(function(){
  const days = CONFIG.days;
  const params = new URLSearchParams(location.search);

  // התאריך היום לפי שעון ישראל, בפורמט 2026-10-19
  function israelToday(){
    return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Jerusalem",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
  }

  // תצוגה מקדימה: ?day=20 מציג את 20.10 כאילו זה היום
  let today = israelToday();
  const forced = params.get("day") || window.__FORCE_DAY;
  if (forced && /^\d{1,2}$/.test(forced)) today = "2026-10-" + forced.padStart(2,"0");
  const isPreview = !!forced;

  const first = days[0].date, last = days[days.length-1].date;
  const currentIdx = days.reduce((acc,d,i)=> d.date <= today ? i : acc, -1);
  let viewIdx = currentIdx;

  const heDate = iso => { const [y,m,d] = iso.split("-"); return `${+d}.${+m}`; };
  const lockSvg = '<svg class="lock" viewBox="0 0 10 12" aria-hidden="true"><rect x="1" y="5" width="8" height="7" rx="1" fill="currentColor"/><path d="M3 5V3.5a2 2 0 0 1 4 0V5" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>';
  const sealSvg = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="12" r="5.5" fill="none" stroke="#1f2a44" stroke-width="1.6"/><circle cx="15" cy="12" r="5.5" fill="none" stroke="#1f2a44" stroke-width="1.6"/></svg>';

  function renderTabs(){
    const nav = document.getElementById("tabs");
    nav.innerHTML = "";
    days.forEach((d,i)=>{
      const b = document.createElement("button");
      b.className = "tab";
      const open = i <= currentIdx;
      b.disabled = !open;
      b.setAttribute("aria-current", i === viewIdx ? "true" : "false");
      b.innerHTML = `${d.tab}${open ? "" : lockSvg}<small>${heDate(d.date)}</small>`;
      b.setAttribute("aria-label", open ? `${d.title}, ${heDate(d.date)}` : `נעול עד ${heDate(d.date)}`);
      if (open) b.addEventListener("click", ()=>{ viewIdx = i; render(false); });
      nav.appendChild(b);
    });
  }

  function renderLocked(){
    document.getElementById("sheet").innerHTML = `
      <div class="locked">
        <h1 class="doc-title">התיק עדיין חתום</h1>
        <p>המסמך הראשון ייפתח ב-${heDate(first)}.</p>
      </div>`;
    document.getElementById("extras").innerHTML = "";
  }

  function renderDoc(animate){
    const d = days[viewIdx];
    const s = d.stamp;
    document.getElementById("sheet").innerHTML = `
      <header class="form-head">
        <div class="seal">${sealSvg}</div>
        <div class="org"><b>הנהלת הנישואין</b><span>אגף אירועים, מועדים ורגשות</span></div>
        <div class="meta">מסמך <b>${d.docNo}</b><br>תאריך <b>${heDate(d.date)}.2026</b></div>
      </header>
      <h1 class="doc-title">${d.title}</h1>
      <div class="body">${renderBody(d)}</div>
      <div class="sign">
        <div class="role">בברכה,<br>מנהל אגף הנישואין<br>בתוקף תפקידו כבעלך</div>
        <div class="sig">${CONFIG.signature}</div>
      </div>
      <div class="stamp ${s.red ? "red" : ""} ${animate ? "slam" : ""}">${s.text}<small>${s.sub}</small></div>`;

    let extras = "";
    const photos = (typeof PHOTOS !== "undefined") ? PHOTOS : {};
    const letters = ["א","ב","ג","ד","ה","ו"];
    const exhibit = (key, caption, n, extraCls) => {
      const p = photos[key]; if (!p) return "";
      return `<figure class="exhibit ${extraCls||""}" style="--ar:${p.ar}">
        <span class="tag">נספח ${letters[n] || n+1}׳</span>
        <img src="${p.src}" alt="${escapeHtml(caption || "תמונה של שנינו")}" loading="lazy">
        ${caption ? `<figcaption>${escapeHtml(caption)}</figcaption>` : ""}
      </figure>`;
    };
    if (d.photo){
      const n = days.slice(0, viewIdx).filter(x => x.photo && photos[x.photo]).length;
      extras += exhibit(d.photo, d.caption, n, viewIdx % 2 ? "tilt-r" : "");
    }
    if (d.gallery){
      const items = days.filter(x => x.photo && photos[x.photo]);
      if (items.length){
        extras += `<section class="gallery"><h2>הנספחים שצורפו לתיק</h2><div class="grid">` +
          items.map((x,i) => exhibit(x.photo, x.caption, i, i % 2 ? "tilt-r" : "")).join("") +
          `</div></section>`;
      }
    }
    if (d.gift){
      extras += `<aside class="slip"><h2>${d.gift.title}</h2><p>${d.gift.text}</p>${d.gift.where ? `<p class="where">${d.gift.where}</p>` : ""}</aside>`;
    }
    if (viewIdx === 0 && CONFIG.personalNote.trim()){
      extras += `<div class="note">${escapeHtml(CONFIG.personalNote.trim())}</div>`;
    }
    if (viewIdx === currentIdx && today <= "2026-10-22"){
      extras += `<div class="clock" id="clock"><span class="label">עד הפירעון</span><span class="digits" id="digits"></span></div>`;
    }
    document.getElementById("extras").innerHTML = extras;
    tick();

    if (animate && d.confetti) confetti();
  }

  function escapeHtml(t){ return t.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

  // תחביר פשוט לגוף ההודעה:
  // שורה ריקה = פסקה חדשה, שורות שמתחילות ב"- " = רשימה ממוספרת,
  // פסקה שמתחילה ב"> " = תיבה מודגשת, **טקסט** = הדגשה
  function inline(t){ return escapeHtml(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); }
  function renderBody(d){
    let html = d.subject ? `<p class="subject">הנדון: <u>${escapeHtml(d.subject)}</u></p>` : "";
    (d.text || "").trim().split(/\n\s*\n/).forEach(block => {
      const lines = block.split("\n").map(l => l.trim()).filter(Boolean);
      if (!lines.length) return;
      if (lines.every(l => l.startsWith("- "))){
        html += "<ol>" + lines.map(l => `<li>${inline(l.slice(2))}</li>`).join("") + "</ol>";
      } else if (lines[0].startsWith(">")){
        const t = lines.join(" ").replace(/^>\s*/, "");
        const i = t.indexOf(":");
        html += i > 0 && i < 40
          ? `<div class="reveal"><b>${escapeHtml(t.slice(0,i+1))}</b>${inline(t.slice(i+1))}</div>`
          : `<div class="reveal">${inline(t)}</div>`;
      } else {
        html += `<p>${lines.map(inline).join("<br>")}</p>`;
      }
    });
    return html;
  }

  // בתצוגה מקדימה מדמים 9:00 בבוקר של היום הנבחר, והשעון ממשיך לרוץ משם
  const clockOffset = isPreview ? new Date(today + "T09:00:00+03:00").getTime() - Date.now() : 0;
  function tick(){
    const el = document.getElementById("digits");
    if (!el) return;
    let ms = new Date(CONFIG.payoffAt).getTime() - (Date.now() + clockOffset);
    const label = document.querySelector("#clock .label");
    if (ms <= 0){ label.textContent = "החוב נפרע"; el.textContent = "תהני"; return; }
    const dd = Math.floor(ms/864e5); ms -= dd*864e5;
    const hh = Math.floor(ms/36e5);  ms -= hh*36e5;
    const mm = Math.floor(ms/6e4);   ms -= mm*6e4;
    const ss = Math.floor(ms/1e3);
    el.innerHTML = (dd ? `${dd}<span>ימים</span>` : "") + `${hh}<span>שעות</span>${mm}<span>דקות</span>${ss}<span>שניות</span>`;
  }

  // קונפטי על קנבס: שני פיצוצים מהפינות התחתונות ואחריהם גשם עדין מלמעלה
  function confetti(){
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cv = document.createElement("canvas"); cv.className = "confetti";
    document.body.appendChild(cv);
    const ctx = cv.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = innerWidth, H = innerHeight;
    cv.width = W*dpr; cv.height = H*dpr; ctx.scale(dpr, dpr);
    const colors = ["#5b3fa0","#b8262e","#d6b36a","#f2eedf","#1f2a44","#e5c47c"];
    const shapes = ["rect","rect","rect","circle","heart","heart"];
    const parts = [];
    const rnd = (a,b) => a + Math.random()*(b-a);
    function add(x, y, vx, vy){
      parts.push({x, y, vx, vy, size:rnd(6,11), rot:rnd(0,6.28), vr:rnd(-.25,.25),
        wob:rnd(0,6.28), vw:rnd(.08,.18), color:colors[(Math.random()*colors.length)|0],
        shape:shapes[(Math.random()*shapes.length)|0]});
    }
    function burst(x, y, angle, n){
      const power = Math.max(W, H) / 48;
      for (let i=0;i<n;i++){
        const a = angle + rnd(-.45,.45), v = power * rnd(.7,1.25);
        add(x, y, Math.cos(a)*v, Math.sin(a)*v);
      }
    }
    burst(0, H, -Math.PI/3, 90);
    burst(W, H, -2*Math.PI/3, 90);
    setTimeout(() => { for (let i=0;i<60;i++) add(rnd(0,W), rnd(-80,-10), rnd(-1,1), rnd(1,3)); }, 450);

    function heart(s){
      ctx.beginPath();
      ctx.moveTo(0, s*.35);
      ctx.bezierCurveTo(-s*1.1, -s*.35, -s*.45, -s*1.05, 0, -s*.45);
      ctx.bezierCurveTo(s*.45, -s*1.05, s*1.1, -s*.35, 0, s*.35);
      ctx.fill();
    }
    const t0 = performance.now();
    (function frame(now){
      const t = (now - t0) / 1000;
      ctx.clearRect(0, 0, W, H);
      const fade = t > 4 ? Math.max(0, 1 - (t-4)/1.5) : 1;
      for (const p of parts){
        p.vy += .32; p.vx *= .985; p.vy *= .985;
        p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.wob += p.vw;
        if (p.y > H + 30) continue;
        ctx.save();
        ctx.globalAlpha = fade;
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.scale(1, Math.cos(p.wob));          // היפוך תלת ממדי של פיסת הנייר
        ctx.fillStyle = p.color;
        if (p.shape === "rect") ctx.fillRect(-p.size/2, -p.size*.35, p.size, p.size*.7);
        else if (p.shape === "circle"){ ctx.beginPath(); ctx.arc(0,0,p.size*.4,0,6.28); ctx.fill(); }
        else heart(p.size*.7);
        ctx.restore();
      }
      if (t < 5.6) requestAnimationFrame(frame); else cv.remove();
    })(t0);
  }

  // המעטפה: מוצגת בכניסה הראשונה בכל יום חדש. בתצוגה מקדימה, תמיד.
  function seenKey(d){ return "opened-" + d.date; }
  function shouldShowEnvelope(){
    if (viewIdx < 0 || viewIdx !== currentIdx) return false;
    if (isPreview) return true;
    try { return !localStorage.getItem(seenKey(days[viewIdx])); } catch(e){ return true; }
  }
  function showEnvelope(onOpen){
    const d = days[viewIdx];
    const scr = document.createElement("div");
    scr.className = "envelope-screen";
    scr.innerHTML = `
      <div class="env-wrap">
        <div class="envelope" id="env">
          <div class="env-back"></div>
          <div class="env-letter"></div>
          <div class="env-front">
            <div class="to"><small>מסמך ${d.docNo}</small>לאשתי היפה</div>
            <div class="secret">סודי</div>
          </div>
          <div class="env-flap"></div>
          <button class="wax" id="wax" aria-label="פתיחת המעטפה">${sealSvg.replace(/#1f2a44/g, "#f6d9d4")}</button>
        </div>
        <p class="hint">הקישי על החותם כדי לפתוח</p>
      </div>`;
    document.body.appendChild(scr);
    const open = () => {
      const env = document.getElementById("env");
      if (env.classList.contains("opened")) return;
      env.classList.add("opened");
      if (navigator.vibrate) navigator.vibrate(35);
      try { localStorage.setItem(seenKey(d), "1"); } catch(e){}
      scr.classList.add("open");
      setTimeout(onOpen, 1150);
      setTimeout(() => scr.remove(), 1700);
    };
    document.getElementById("wax").addEventListener("click", open);
  }

  function renderPreviewBar(){
    if (!isPreview || window.__FORCE_DAY) return;
    const bar = document.getElementById("previewBar");
    bar.hidden = false;
    bar.innerHTML = "תצוגה מקדימה: " + ["18","19","20","21","22","23"].map(n =>
      `<a href="?day=${n}" aria-current="${today.endsWith("-"+n) ? "true" : "false"}">${n}.10</a>`).join("");
  }

  function render(animate){
    renderTabs();
    if (viewIdx < 0) renderLocked(); else renderDoc(animate);
  }

  renderPreviewBar();
  if (shouldShowEnvelope()){
    render(false);
    showEnvelope(() => render(true));
  } else {
    render(true);
  }
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
